        margin: 0;

        font-size: clamp(34px, 6vw, 56px);

        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #475569;
        font-size: 18px;
        line-height: 1.6;
      }

      nav {
        display: grid;
        gap: 12px;
        margin-top: 32px;
      }

      a {
        display: block;
        padding: 16px 18px;
        border: 1px solid #dbeafe;
        border-radius: 16px;
        color: #2563eb;
        font-weight: 700;
        text-decoration: none;
